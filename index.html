<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="9Th-Grade AI — the AI operating system for BCS, Bangladesh Bank AD, and competitive government exam preparation in Bangladesh." />
    <meta name="theme-color" content="#05060a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the critical Geist Latin font (hero text) from same origin to
         eliminate the third-party round-trip variance on mobile real-network loads.
         The async Google Fonts link below still serves the full set as fallback. -->
    <link rel="preload" as="font" type="font/woff2" href="/Geist-Latin.woff2" crossorigin />
    <!-- Fonts load asynchronously (not render-blocking) with font-display:swap
         so first paint isn't blocked on the stylesheet; text renders in fallback
         then swaps in. Trimmed to the weights the design actually uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;700&family=Hind+Siliguri:wght@400;600;700&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;700&family=Hind+Siliguri:wght@400;600;700&display=swap" /></noscript>
    <title>9Th-Grade AI — Your preparation, engineered by intelligence.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
